name: Build
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: desktop/build/jdks
          key: jdk-win-${{ hashFiles('desktop/build.gradle') }}
      - run: ./gradlew.bat desktop:jpackageImage
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/build/jpackage/
